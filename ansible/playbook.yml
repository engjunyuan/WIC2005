---
# ============================================================
# DEPLOYMENT STAGE: Initial Configuration
# ============================================================

- name: Configure network routers
  hosts: routers
  gather_facts: false
  vars_files:
    - group_vars_all.yml
  roles:
    - role: router_config
      tags: [router_config, topology_setup, deployment]

- name: Configure network switches
  hosts: switches
  gather_facts: false
  vars_files:
    - group_vars_all.yml
  roles:
    - role: switch_config
      tags: [switch_config, topology_setup, deployment]

- name: Batch update shared settings
  hosts: all
  gather_facts: false
  vars_files:
    - group_vars_all.yml
  roles:
    - role: batch_update
      tags: [batch_update, topology_setup, deployment]

- name: Backup running configurations
  hosts: all
  gather_facts: false
  vars_files:
    - group_vars_all.yml
  roles:
    - role: backup_configs
      tags: [backup_configs, topology_setup, deployment]

# ============================================================
# POST-DEPLOYMENT STAGE: Validation & Verification
# ============================================================

- name: Validate post-deployment configurations
  hosts: all
  gather_facts: false
  vars_files:
    - group_vars_all.yml
  roles:
    - role: post_deployment_validation
      tags: [post_deployment_validation, post_deployment, testing]

- name: Collect telemetry and generate report
  hosts: all
  gather_facts: false
  vars_files:
    - group_vars_all.yml
  roles:
    - role: telemetry_report
      tags: [telemetry_report, topology_setup, post_deployment]

# ============================================================
# MONITORING STAGE: Health & Security Verification
# ============================================================

- name: Monitor device health and stability
  hosts: all
  gather_facts: false
  vars_files:
    - group_vars_all.yml
  roles:
    - role: health_monitoring
      tags: [health_monitoring, monitoring, operations]

- name: Verify security configurations
  hosts: all
  gather_facts: false
  vars_files:
    - group_vars_all.yml
  roles:
    - role: security_verification
      tags: [security_verification, security, operations]
