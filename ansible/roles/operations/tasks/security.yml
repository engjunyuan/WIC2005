---
# Security Verification Tasks

- name: Set security audit timestamp
  set_fact:
    security_audit_timestamp: "{{ lookup('pipe', 'date +%s') }}"
    report_time_local: "{{ lookup('pipe', 'TZ=Asia/Kuala_Lumpur date +%Y-%m-%d\\ %H:%M:%S\\ MYT') }}"
    report_time_filename: "{{ lookup('pipe', 'TZ=Asia/Kuala_Lumpur date +%Y%m%d_%H%M%S') }}"
  run_once: true

# ============================================================
# ACL VERIFICATION (ROUTERS)
# ============================================================

- name: Collect ACL configurations from routers
  raw: "vtysh -c 'show access-lists'"
  register: acl_list
  changed_when: false
  when: "'routers' in group_names"
  ignore_errors: yes

- name: Summarize ACL presence across devices
  run_once: true
  vars:
    acl_hosts: >-
      {{
        groups.get('all', []) | map('extract', hostvars) |
        selectattr('acl_list', 'defined') |
        list
      }}
  debug:
    msg: |
      ACL summary:
      {% if acl_hosts %}
      {% for host in acl_hosts %}
        - {{ host.inventory_hostname }}: {{ host.acl_list.stdout | default('No ACL output') | truncate(120) }}
      {% endfor %}
      {% else %}
        No ACL data collected from devices.
      {% endif %}

- name: Verify inbound ACLs on WAN interfaces
  raw: "vtysh -c 'show ip access-lists' 2>/dev/null || echo 'No ACLs configured'"
  register: inbound_acls
  changed_when: false
  when: "'routers' in group_names and inventory_hostname == 'router1'"
  ignore_errors: yes

- name: Check ACL statistics and hit counts
  raw: "vtysh -c 'show access-lists detail' 2>/dev/null || echo 'Not available'"
  register: acl_statistics
  changed_when: false
  when: "'routers' in group_names and inventory_hostname == 'router1'"
  ignore_errors: yes

# ============================================================
# NAT VERIFICATION
# ============================================================

- name: Verify NAT configuration on routers
  raw: "vtysh -c 'show ip nat translations' 2>/dev/null || echo 'NAT verification skipped - feature not available'"
  register: nat_translations
  changed_when: false
  when: "'routers' in group_names"
  ignore_errors: yes

- name: Check NAT inside network configuration
  raw: "vtysh -c 'show running-config' | grep -A 50 'ip nat' || echo 'No NAT config found'"
  register: nat_config
  changed_when: false
  when: "'routers' in group_names"
  ignore_errors: yes

- name: Verify NAT pool settings
  raw: "vtysh -c 'show ip nat pool' 2>/dev/null || echo 'NAT pools not available'"
  register: nat_pools
  changed_when: false
  when: "'routers' in group_names"
  ignore_errors: yes

# ============================================================
# FIREWALL & INTERFACE SECURITY
# ============================================================

- name: Verify all interfaces have IP addresses assigned
  raw: "ip addr show | grep 'inet ' | wc -l"
  register: interface_ip_count
  changed_when: false
  ignore_errors: yes

- name: Check for unnecessary services listening on open ports
  raw: "netstat -tlnp 2>/dev/null | grep LISTEN || ss -tlnp 2>/dev/null | grep LISTEN || echo 'netstat/ss not available'"
  register: listening_services
  changed_when: false
  ignore_errors: yes

- name: Verify SSH is configured securely on routers
  raw: "sshd -T 2>/dev/null | grep -E 'port|protocol|permit' || echo 'SSH config check skipped'"
  register: ssh_security
  changed_when: false
  when: "'routers' in group_names"
  ignore_errors: yes

# ============================================================
# VLAN SECURITY (SWITCHES)
# ============================================================

- name: Verify native VLAN configuration on switches
  raw: "vlan show 2>/dev/null || cat /config/vlans.conf || echo 'VLAN config not available'"
  register: vlan_native
  changed_when: false
  when: "'switches' in group_names"
  ignore_errors: yes

- name: Check for VLAN isolation on switches
  raw: "brctl show"
  register: vlan_isolation
  changed_when: false
  when: "'switches' in group_names"
  ignore_errors: yes

- name: Verify trunk port security on switches
  raw: "grep -i 'trunk' /config/vlans.conf 2>/dev/null || echo 'Trunk config check skipped'"
  register: trunk_security
  changed_when: false
  when: "'switches' in group_names"
  ignore_errors: yes

# ============================================================
# AUTHENTICATION & CREDENTIALS
# ============================================================

- name: Verify SSH key-based authentication is available
  raw: "[ -f /root/.ssh/authorized_keys ] && echo 'SSH keys configured' || echo 'SSH keys not configured'"
  register: ssh_keys
  changed_when: false
  ignore_errors: yes

- name: Check for weak password settings in shadow file
  raw: 'getent shadow | grep -E ":\*:|:!:" | wc -l'
  register: locked_accounts
  changed_when: false
  ignore_errors: yes

- name: Verify sudoers configuration
  raw: "[ -f /etc/sudoers ] && echo 'sudoers configured' || echo 'sudoers not found'"
  register: sudoers_check
  changed_when: false
  ignore_errors: yes

# ============================================================
# LOGGING & MONITORING SECURITY
# ============================================================

- name: Verify FRR logging is enabled on routers
  raw: "grep -i 'log' /etc/frr/frr.conf || echo 'Logging not explicitly configured'"
  register: frr_logging
  changed_when: false
  when: "'routers' in group_names"
  ignore_errors: yes

- name: Check for FRR debug logs
  raw: "tail -50 /var/log/frr/frr.log | grep -i 'debug\\|error\\|warning' || echo 'No errors in recent logs'"
  register: frr_debug_logs
  changed_when: false
  when: "'routers' in group_names"
  ignore_errors: yes

- name: Verify syslog is functioning
  raw: "[ -f /var/log/syslog ] || [ -f /var/log/messages ] && echo 'Syslog available' || echo 'Syslog not found'"
  register: syslog_check
  changed_when: false
  ignore_errors: yes

# ============================================================
# SECURITY BASELINES
# ============================================================

- name: Verify hostname is set correctly on all devices
  raw: "hostname"
  register: hostname_check
  changed_when: false
  ignore_errors: yes

- name: Check time synchronization status
  raw: "ntpstat 2>/dev/null || date || echo 'Time check skipped'"
  register: time_sync
  changed_when: false
  ignore_errors: yes

- name: Verify kernel parameters for security (IP forwarding)
  raw: "sysctl net.ipv4.ip_forward"
  register: ip_forward_setting
  changed_when: false
  ignore_errors: yes

- name: Check kernel parameters for security (TCP SYN cookies)
  raw: "sysctl net.ipv4.tcp_syncookies"
  register: tcp_syncookies
  changed_when: false
  ignore_errors: yes

# ============================================================
# GENERATE SECURITY VERIFICATION REPORT
# ============================================================

- name: Create security verification report directory
  file:
    path: "{{ playbook_dir }}/../reports/security"
    state: directory
  delegate_to: localhost
  run_once: true

- name: Generate security verification report
  template:
    src: security_report.md.j2
    dest: "{{ playbook_dir }}/../reports/security/security_report.md"
  delegate_to: localhost
  run_once: true
  ignore_errors: yes

- name: Display security verification summary
  debug:
    msg: |
      ========================================
      SECURITY VERIFICATION SUMMARY
      ========================================
      Timestamp: {{ report_time_local }}
      
      Security Checks:
        ✓ ACL Configurations Verified
        ✓ NAT Settings Validated
        ✓ Interface Security Checked
        ✓ VLAN Isolation Confirmed
        ✓ SSH Key Verification
        ✓ Logging & Monitoring Enabled
        ✓ Security Baselines Validated
        
      Report Location: reports/security/
      ========================================
  run_once: true
  ignore_errors: yes
