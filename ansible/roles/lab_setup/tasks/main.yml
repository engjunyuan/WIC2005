---
# ============================================================
# LAB SETUP ROLE
# Consolidated deployment role combining all setup tasks
# Includes: Router config, Switch config, Batch updates, Backups
# ============================================================

# ============================================================
# WAIT FOR CONNECTIVITY
# ============================================================

- name: Wait for SSH to be available on all devices
  wait_for:
    host: "{{ ansible_host }}"
    port: "{{ ansible_port | default(22) }}"
    timeout: 60
  delegate_to: localhost

# ============================================================
# SET HOSTNAMES (ALL DEVICES)
# ============================================================

- name: Set hostname on all devices
  raw: |
    current="$(cat /etc/hostname 2>/dev/null || true)"
    if [ "$current" = "{{ inventory_hostname }}" ]; then
      echo "UNCHANGED"
    else
      hostname "{{ inventory_hostname }}"
      echo "{{ inventory_hostname }}" > /etc/hostname
      echo "CHANGED"
    fi
  register: hostname_update
  changed_when: "'CHANGED' in hostname_update.stdout"

# ============================================================
# ROUTER CONFIGURATION (OSPF, ACLs, NAT)
# ============================================================

- name: Push FRR OSPF configuration to routers
  raw: |
    tmp="/tmp/frr.conf.new"
    cat > "$tmp" <<'EOF'
    ! FRR OSPF baseline
    hostname {{ inventory_hostname }}
    log file /var/log/frr/frr.log
    service integrated-vtysh-config

    router ospf
      network 0.0.0.0/0 area {{ ospf_area }}
    !
    line vty
    EOF
    need_change=0
    if [ ! -f /etc/frr/frr.conf ] || ! cmp -s "$tmp" /etc/frr/frr.conf; then
      need_change=1
    fi
    current_meta="$(stat -c '%U:%G %a' /etc/frr/frr.conf 2>/dev/null || echo missing)"
    if [ "$current_meta" != "frr:frr 640" ]; then
      need_change=1
    fi
    if [ "$need_change" -eq 1 ]; then
      cat "$tmp" > /etc/frr/frr.conf
      chown frr:frr /etc/frr/frr.conf
      chmod 640 /etc/frr/frr.conf
      echo "CHANGED"
    else
      echo "UNCHANGED"
    fi
    rm -f "$tmp"
  register: frr_config
  changed_when: "'CHANGED' in frr_config.stdout"
  when: "'routers' in group_names"

- name: Restart FRR daemons on routers
  raw: |
    killall watchfrr 2>/dev/null || true
    pkill zebra bgpd ripd ospfd staticd mgmtd 2>/dev/null || true
    rm -f /var/run/frr/*.pid
    /usr/lib/frr/frrinit.sh start
  when: "'routers' in group_names and frr_config is changed"

- name: Display router OSPF configuration
  raw: vtysh -c 'show running-config'
  register: running_config
  changed_when: false
  when: "'routers' in group_names"

- name: Show router running config summary
  debug:
    msg: |
      Router {{ inventory_hostname }} OSPF Configuration:
      {{ running_config.stdout_lines | join('\n') | truncate(500) }}
  when: "'routers' in group_names and running_config is defined"

# ============================================================
# SWITCH CONFIGURATION (VLANs, BRIDGING)
# ============================================================

- name: Create VLAN subinterfaces on switches
  raw: |
    # create vlan link if missing
    ip link show eth0.{{ item.id }} >/dev/null 2>&1 || ip link add link eth0 name eth0.{{ item.id }} type vlan id {{ item.id }}
    ip link set eth0.{{ item.id }} up
    # add to bridge only if not already a member
    bridge link | grep -q "eth0.{{ item.id }}@" || brctl addif br0 eth0.{{ item.id }}
  loop: "{{ vlans | default([]) }}"
  changed_when: false
  ignore_errors: yes
  when: "'switches' in group_names"

- name: Save VLAN configuration on switches
  raw: |
    tmp="/tmp/vlans.conf.new"
    cat > "$tmp" <<EOF
    {% for vlan in vlans | default([]) %}
    {{ vlan.id }}:{{ vlan.name }}
    {% endfor %}
    EOF
    if [ -f /config/vlans.conf ] && cmp -s "$tmp" /config/vlans.conf; then
      echo "UNCHANGED"
    else
      cat "$tmp" > /config/vlans.conf
      echo "CHANGED"
    fi
    rm -f "$tmp"
  when: vlans is defined and "'switches' in group_names"
  register: vlan_config
  changed_when: "'CHANGED' in vlan_config.stdout"

- name: Display switch bridge configuration
  raw: brctl show
  register: bridge_status
  changed_when: false
  when: "'switches' in group_names"

- name: Show switch bridge status
  debug:
    msg: |
      Switch {{ inventory_hostname }} Bridge Status:
      {{ bridge_status.stdout }}
  when: "'switches' in group_names and bridge_status is defined"

# ============================================================
# BATCH UPDATES (DNS, NAT GATEWAY, COMMON SETTINGS)
# ============================================================

- name: Configure DNS resolvers on all devices
  raw: |
    tmp="/tmp/resolv.conf.new"
    cat > "$tmp" <<'EOF'
    search {{ network.domain }}
    {% for server in network.dns_servers %}
    nameserver {{ server }}
    {% endfor %}
    EOF
    if [ -f /etc/resolv.conf ] && cmp -s "$tmp" /etc/resolv.conf; then
      echo "UNCHANGED"
    else
      cat "$tmp" > /etc/resolv.conf
      echo "CHANGED"
    fi
    rm -f "$tmp"
  register: resolv_update
  changed_when: "'CHANGED' in resolv_update.stdout"

- name: Update NAT gateway hosts entry on all devices
  raw: |
    tmp="/tmp/hosts.updated"
    grep -vE '(^|\\s)nat-gateway(\\s|$)' /etc/hosts > "$tmp"
    echo "{{ network.nat_server_ip }} nat-gateway" >> "$tmp"
    if [ -f /etc/hosts ] && cmp -s "$tmp" /etc/hosts; then
      echo "UNCHANGED"
    else
      cat "$tmp" > /etc/hosts
      echo "CHANGED"
    fi
    rm -f "$tmp"
  register: hosts_update
  changed_when: "'CHANGED' in hosts_update.stdout"

- name: Verify DNS configuration
  raw: cat /etc/resolv.conf
  register: dns_verify
  changed_when: false

- name: Show DNS configuration
  debug:
    msg: |
      Device {{ inventory_hostname }} DNS Configuration:
      {{ dns_verify.stdout }}
  ignore_errors: yes

# ============================================================
# CONFIGURATION BACKUP
# ============================================================

- name: Set backup date stamp
  set_fact:
    backup_date: "{{ lookup('pipe', 'date +%F') }}"
  run_once: true

- name: Create backup directory
  file:
    path: "{{ backup_dir }}"
    state: directory
  delegate_to: localhost
  run_once: true

- name: Backup running router configurations
  raw: vtysh -c 'show running-config'
  register: router_backup
  changed_when: false
  when: "'routers' in group_names"

- name: Save router configuration backup
  copy:
    content: "{{ router_backup.stdout }}"
    dest: "{{ backup_dir }}/{{ inventory_hostname }}_{{ backup_date }}.conf"
  delegate_to: localhost
  when: "'routers' in group_names and router_backup is defined"

- name: Backup switch VLAN configurations
  raw: cat /config/vlans.conf
  register: switch_backup
  changed_when: false
  when: "'switches' in group_names"
  ignore_errors: yes

- name: Save switch configuration backup
  copy:
    content: "{{ switch_backup.stdout }}"
    dest: "{{ backup_dir }}/{{ inventory_hostname }}_{{ backup_date }}.conf"
  delegate_to: localhost
  when: "'switches' in group_names and switch_backup is defined"

# ============================================================
# LAB SETUP COMPLETION SUMMARY
# ============================================================

- name: Display lab setup completion status
  debug:
    msg: |
      ========================================
      LAB SETUP COMPLETE
      ========================================
      Device: {{ inventory_hostname }}
      
      ✓ SSH connectivity verified
      ✓ Hostname configured
      {% if 'routers' in group_names %}
      ✓ OSPF routing configured
      ✓ FRR services restarted
      {% endif %}
      {% if 'switches' in group_names %}
      ✓ VLAN configuration applied
      ✓ Bridge members configured
      {% endif %}
      ✓ DNS resolvers configured
      ✓ NAT gateway updated
      ✓ Configuration backed up
      
      Backup Location: {{ backup_dir }}/{{ inventory_hostname }}_{{ backup_date }}.conf
      ========================================
  when: inventory_hostname is defined
