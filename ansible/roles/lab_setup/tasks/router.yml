---
# ROUTER CONFIGURATION (OSPF, ACLs, NAT)

- name: Render FRR configuration for routers (OSPF + ACLs from acl_policies)
  template:
    src: frr.conf.j2
    dest: /etc/frr/frr.conf
    owner: frr
    group: frr
    mode: "0640"
  register: frr_config
  when: "'routers' in group_names or device_type == 'router'"

- name: Prepare Batfish snapshot with rendered config (optional)
  when: ("'routers' in group_names or device_type == 'router'") and (batfish_enabled | default(false))
  block:
    - name: Read rendered FRR config from router
      slurp:
        path: /etc/frr/frr.conf
      register: frr_conf_slurp

    - name: Ensure Batfish snapshot directory exists
      file:
        path: "{{ playbook_dir }}/batfish/snapshots/{{ inventory_hostname }}/configs"
        state: directory
        mode: "0755"
      delegate_to: localhost

    - name: Save FRR config to Batfish snapshot
      copy:
        dest: "{{ playbook_dir }}/batfish/snapshots/{{ inventory_hostname }}/configs/frr.conf"
        content: "{{ frr_conf_slurp.content | b64decode }}"
        mode: "0644"
      delegate_to: localhost

    - name: Run Batfish placeholder validation
      delegate_to: localhost
      shell: |
        echo "Batfish validation placeholder for {{ inventory_hostname }}"
        echo "Plug in bf_init_snapshot / bf_answer checks here."
      changed_when: false

- name: Restart FRR daemons on routers
  raw: |
    killall watchfrr 2>/dev/null || true
    pkill zebra bgpd ripd ospfd staticd mgmtd 2>/dev/null || true
    rm -f /var/run/frr/*.pid
    /usr/lib/frr/frrinit.sh start
  when: "('routers' in group_names or device_type == 'router') and frr_config is changed"

- name: Normalize router hostname in running config
  raw: |
    vtysh -c 'configure terminal' -c 'hostname {{ inventory_hostname }}'
  changed_when: false
  when: "'routers' in group_names or device_type == 'router'"

- name: Display router OSPF configuration
  raw: vtysh -c 'show running-config'
  register: running_config
  changed_when: false
  when: "'routers' in group_names or device_type == 'router'"

- name: Show router running config summary
  debug:
    msg: |
      Router {{ inventory_hostname }} OSPF Configuration:
      {{ running_config.stdout_lines | join('\n') | truncate(500) }}
  when: "('routers' in group_names or device_type == 'router') and running_config is defined"
