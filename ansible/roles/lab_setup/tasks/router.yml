---
# ROUTER CONFIGURATION (OSPF, ACLs, NAT)

- name: Push FRR OSPF configuration to routers
  raw: |
    tmp="/tmp/frr.conf.new"
    cat > "$tmp" <<'EOF'
    ! FRR OSPF baseline
    hostname {{ inventory_hostname }}
    log file /var/log/frr/frr.log
    service integrated-vtysh-config

    interface eth0
     ip ospf hello-interval {{ ospf.hello_interval | default(30) }}
     ip ospf dead-interval {{ ospf.dead_interval | default(120) }}
    !
    interface eth1
     ip ospf hello-interval {{ ospf.hello_interval | default(30) }}
     ip ospf dead-interval {{ ospf.dead_interval | default(120) }}
    !
    interface eth2
     ip ospf hello-interval {{ ospf.hello_interval | default(30) }}
     ip ospf dead-interval {{ ospf.dead_interval | default(120) }}
    !
    router ospf
      network 0.0.0.0/0 area {{ ospf_area }}
    {% for iface in ospf.passive_interfaces | default([]) %}
      passive-interface {{ iface }}
    {% endfor %}
    !
    line vty
    EOF
    need_change=0
    if [ ! -f /etc/frr/frr.conf ] || ! cmp -s "$tmp" /etc/frr/frr.conf; then
      need_change=1
    fi
    current_meta="$(stat -c '%U:%G %a' /etc/frr/frr.conf 2>/dev/null || echo missing)"
    if [ "$current_meta" != "frr:frr 640" ]; then
      need_change=1
    fi
    if [ "$need_change" -eq 1 ]; then
      cat "$tmp" > /etc/frr/frr.conf
      chown frr:frr /etc/frr/frr.conf
      chmod 640 /etc/frr/frr.conf
      echo "CHANGED"
    else
      echo "UNCHANGED"
    fi
    rm -f "$tmp"
  register: frr_config
  changed_when: "'CHANGED' in frr_config.stdout"
  when: "'routers' in group_names or device_type == 'router'"

- name: Restart FRR daemons on routers
  raw: |
    killall watchfrr 2>/dev/null || true
    pkill zebra bgpd ripd ospfd staticd mgmtd 2>/dev/null || true
    rm -f /var/run/frr/*.pid
    /usr/lib/frr/frrinit.sh start
  when: "('routers' in group_names or device_type == 'router') and frr_config is changed"

- name: Normalize router hostname in running config
  raw: |
    vtysh -c 'configure terminal' -c 'hostname {{ inventory_hostname }}' -c 'write memory'
  changed_when: false
  when: "'routers' in group_names or device_type == 'router'"

- name: Display router OSPF configuration
  raw: vtysh -c 'show running-config'
  register: running_config
  changed_when: false
  when: "'routers' in group_names or device_type == 'router'"

- name: Show router running config summary
  debug:
    msg: |
      Router {{ inventory_hostname }} OSPF Configuration:
      {{ running_config.stdout_lines | join('\n') | truncate(500) }}
  when: "('routers' in group_names or device_type == 'router') and running_config is defined"
