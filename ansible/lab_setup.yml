---
# ============================================================
# LAB SETUP PLAYBOOK
# Consolidated playbook for initial lab environment setup
# Includes: Hostname configuration, OSPF routing, VLAN setup,
# DNS/NAT configuration, and configuration backups
# ============================================================
# Usage:
#   ansible-playbook -i inventory.yml lab_setup.yml -v
# ============================================================

- name: Setup lab environment on all devices
  hosts: all
  gather_facts: false
  vars_files:
    - group_vars_all.yml
  roles:
    - role: lab_setup
      tags: [lab_setup, setup, deployment]
