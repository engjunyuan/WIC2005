# Network topology and automation variables
network:
  domain: lab.local
  ntp_server: pool.ntp.org
  dns_servers:
    - 8.8.8.8
    - 1.1.1.1
  nat_server_ip: 10.0.1.254

telemetry:
  ping_targets:
    - 172.199.0.10
    - 172.199.0.11
  log_tail_lines: 50

# OSPF configuration
ospf:
  process_id: 1
  router_id_base: 10.255.255
  hello_interval: 30
  dead_interval: 120
  passive_interfaces:
    - eth0
    - eth2

# BGP configuration (optional)
bgp:
  asn: 65000

# Default credentials
device_credentials:
  routers:
    username: root
    password: router123
  switches:
    username: root
    password: switch123

# Automation tasks to perform
automation_tasks:
  - configure_hostname
  - configure_interfaces
  - configure_routing
  - configure_vlans
  - backup_configs

# Local path for backups on the controller
backup_dir: "{{ playbook_dir }}/../backups"

# IPsec (strongSwan) defaults
ipsec:
  mode: hub_spoke   # hub_spoke or mesh
  hub: router1
  psk: wic2005
  ike: aes256-sha256-modp2048
  esp: aes256-sha256
  auto: start
