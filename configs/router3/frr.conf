! FRR OSPF baseline
hostname router3
log file /var/log/frr/frr.log
service integrated-vtysh-config

interface eth0
ip ospf hello-interval 30
ip ospf dead-interval 120
!
interface eth1
ip ospf hello-interval 30
ip ospf dead-interval 120
!
interface eth2
ip ospf hello-interval 30
ip ospf dead-interval 120
!
router ospf
  network 0.0.0.0/0 area 0.0.0.0
  passive-interface eth0
  passive-interface eth2
!
line vty
